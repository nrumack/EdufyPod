image: maven:3.8.5-jdk-17

stages:
  - build
  - test
  - docker

variables:
  DOCKER_DRIVER: overlay2

before_script:
  - echo "Starting CI for $CI_PROJECT_NAME"

build:
  stage: build
  script:
    - mvn clean package -DskipTests

test:
  stage: test
  script:
    - mvn test

docker:
  stage: docker
  script:
    - docker build -t registry.gitlab.com/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA .
    - docker push registry.gitlab.com/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA
  only:
    - main
